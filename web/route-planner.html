<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>黑流树海 · 路线试算</title>
<style>
:root {
  color-scheme: dark;
  --bg:#0b0f12;
  --panel:#12181c;
  --panel-2:#171f24;
  --line:#2c373e;
  --text:#edf3f4;
  --muted:#94a4aa;
  --cyan:#48d5c7;
  --gold:#edc35b;
  --red:#ef746f;
  --violet:#b497ff;
}
* { box-sizing:border-box }
body {
  margin:0;
  background:linear-gradient(145deg,#0b0f12,#0f1518 60%,#0a1010);
  color:var(--text);
  font:14px/1.45 system-ui,"Microsoft YaHei",sans-serif;
}
button,input,select {
  color:var(--text);
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:6px;
  padding:7px 9px;
  font:inherit;
}
button { cursor:pointer }
button:hover { border-color:#66808b }
button.primary { background:#17685f; border-color:#2da799 }
button.danger { color:#ffaaa6 }
header {
  display:flex;
  justify-content:space-between;
  gap:18px;
  align-items:flex-end;
  padding:18px 22px 14px;
  border-bottom:1px solid var(--line);
}
h1,h2,h3,p { margin:0 }
h1 { font-size:20px; font-weight:600; letter-spacing:.02em }
.subtitle { color:var(--muted); margin-top:4px }
.toolbar {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:end;
}
.field {
  display:grid;
  gap:4px;
  color:var(--muted);
  font-size:12px;
}
.field input[type=number] { width:76px }
.workspace {
  display:grid;
  grid-template-columns:minmax(0,1.65fr) minmax(340px,.7fr);
  gap:14px;
  padding:14px;
  align-items:start;
}
.map-column { min-width:0 }
.map-shell {
  position:relative;
  aspect-ratio:16/9;
  overflow:hidden;
  background:#030505;
  border:1px solid var(--line);
  border-radius:10px;
}
.map-shell img,.map-shell svg {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}
.map-shell svg { touch-action:none }
.base-edge {
  stroke:#718087;
  stroke-width:2;
  opacity:.5;
  vector-effect:non-scaling-stroke;
}
.route-edge {
  stroke:var(--cyan);
  stroke-width:5;
  vector-effect:non-scaling-stroke;
  filter:drop-shadow(0 0 4px #1aa89a);
}
.route-edge.jump {
  stroke:var(--violet);
  stroke-dasharray:10 7;
  filter:drop-shadow(0 0 4px #6f50be);
}
.node {
  fill:#0d1114dd;
  stroke:#b5c1c5;
  stroke-width:2.5;
  vector-effect:non-scaling-stroke;
  cursor:pointer;
}
.node:hover { stroke:var(--gold); stroke-width:4 }
.node.event { stroke:#72cfd0 }
.node.combat { stroke:#ef746f }
.node.special { stroke:#b497ff }
.node.forest { stroke:#849297 }
.node.current { fill:#17685f; stroke:#78f2df }
.node.route { fill:#17685f; stroke:#78f2df }
.node.selected { fill:#886c1b; stroke:#ffe795 }
.node-label {
  fill:#fff;
  stroke:#050708;
  stroke-width:3;
  paint-order:stroke;
  font-size:13px;
  font-weight:600;
  pointer-events:none;
}
.step-number {
  fill:#08100f;
  font-size:10px;
  font-weight:700;
  text-anchor:middle;
  dominant-baseline:central;
  pointer-events:none;
}
.map-footer {
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-top:8px;
  color:var(--muted);
  min-height:22px;
}
.message.error { color:#ffaaa6 }
.message.ok { color:#8ce1d7 }
.sidebar { display:grid; gap:10px }
.metrics {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.metric,.panel {
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:9px;
}
.metric { padding:10px }
.metric-label { color:var(--muted); font-size:12px }
.metric-value { font-size:22px; margin-top:2px; font-variant-numeric:tabular-nums }
.metric-value.warn { color:var(--red) }
.panel { padding:12px }
.panel h2 {
  font-size:14px;
  font-weight:600;
  margin-bottom:9px;
}
.row {
  display:flex;
  gap:7px;
  align-items:end;
  flex-wrap:wrap;
}
.row .grow { flex:1; min-width:140px }
.compact-list {
  margin:0;
  padding-left:19px;
  color:#d9e1e3;
}
.compact-list li+li { margin-top:4px }
.empty { color:var(--muted) }
.table-wrap { overflow-x:auto }
table {
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}
th,td {
  padding:6px 5px;
  border-bottom:1px solid #253037;
  text-align:left;
  vertical-align:middle;
}
th { color:var(--muted); font-weight:500 }
td.num,th.num { text-align:right; font-variant-numeric:tabular-nums }
td input { width:62px; padding:5px }
.route-table { max-height:250px; overflow:auto }
.resource-table td:first-child { color:#c8d4d7; width:82px }
.resource-table td:last-child { text-align:right }
.reward-known { color:var(--cyan); font-variant-numeric:tabular-nums }
.reward-possible { color:var(--gold) }
.strategy-controls {
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:9px;
}
.strategy-controls label {
  display:flex;
  gap:6px;
  align-items:center;
  color:var(--muted);
  font-size:12px;
}
.strategy-controls input[type=number] { width:58px }
.strategy-list { display:grid; gap:7px }
.strategy-card {
  padding:9px;
  border:1px solid #2a373d;
  border-radius:8px;
  background:#0d1316;
}
.strategy-card.active { border-color:var(--cyan) }
.strategy-head {
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:flex-start;
}
.strategy-title { font-weight:650 }
.strategy-score {
  color:var(--cyan);
  font-variant-numeric:tabular-nums;
}
.strategy-route {
  margin-top:6px;
  color:#dce5e7;
  font-size:12px;
}
.strategy-meta {
  margin-top:5px;
  color:var(--muted);
  font-size:11px;
}
.strategy-evidence {
  margin-top:5px;
  color:var(--gold);
  font-size:11px;
}
.strategy-card button { margin-top:7px; width:100% }
.catalog-detail {
  margin-top:9px;
  padding:9px;
  background:#0d1316;
  border:1px solid #253037;
  border-radius:7px;
}
.catalog-detail p+p { margin-top:7px }
.catalog-dimensions {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:5px 10px;
  margin-top:8px;
}
.catalog-dimension {
  display:flex;
  justify-content:space-between;
  gap:8px;
  border-top:1px solid #202b30;
  padding-top:5px;
}
.catalog-dimension span:last-child { color:#dce7e8; text-align:right }
.tag {
  display:inline-block;
  border:1px solid var(--line);
  border-radius:999px;
  padding:1px 6px;
  color:var(--muted);
  white-space:nowrap;
}
.muted { color:var(--muted) }
.hidden { display:none !important }
@media(max-width:980px) {
  header { align-items:flex-start; flex-direction:column }
  .workspace { grid-template-columns:1fr }
}
@media(max-width:540px) {
  .metrics { grid-template-columns:1fr }
  header,.workspace { padding-left:9px; padding-right:9px }
  .node-label { display:none }
}
</style>
</head>
<body>
<header>
  <div>
    <h1>黑流树海 · 路线试算</h1>
    <p class="subtitle">点击节点逐步规划；路线排序会结合当前层的实测战后奖励与样本置信度。</p>
  </div>
  <div class="toolbar">
    <label class="field">初始行动力
      <input id="initial-ap" type="number" min="0" max="99" value="5">
    </label>
    <label class="field">当前层
      <select id="current-floor">
        <option value="1">第1层</option><option value="2">第2层</option>
        <option value="3">第3层</option><option value="4">第4层</option>
        <option value="5">第5层</option><option value="6">第6层</option>
      </select>
    </label>
    <label class="field">下一步移动
      <select id="movement-select"></select>
    </label>
    <button id="undo-button" type="button">撤销一步</button>
    <button id="reset-button" class="danger" type="button">清空路线</button>
  </div>
</header>
<main class="workspace">
  <section class="map-column">
    <div class="map-shell">
      <img id="map-image" alt="用于路线试算的游戏地图截图">
      <svg id="map-overlay" viewBox="0 0 1280 720"
        role="img" aria-label="可点击的识别路径图"></svg>
    </div>
    <div class="map-footer">
      <span id="map-hint">从当前位置开始，选择相邻节点。</span>
      <span id="message" class="message"></span>
    </div>
  </section>
  <aside class="sidebar">
    <section class="metrics" aria-label="路线资源摘要">
      <div class="metric">
        <div class="metric-label">剩余行动力</div>
        <div id="metric-ap" class="metric-value">—</div>
      </div>
      <div class="metric">
        <div class="metric-label">可计算期望种类</div>
        <div id="metric-resource" class="metric-value">—</div>
      </div>
      <div class="metric">
        <div class="metric-label">零件估值</div>
        <div id="metric-parts" class="metric-value">—</div>
      </div>
    </section>

    <section class="panel">
      <h2>候选路线 · 四种目标</h2>
      <div class="strategy-controls">
        <label>
          <input id="recommend-use-parts" type="checkbox" checked>
          所有策略允许使用加工品
        </label>
        <label>
          至少保留可跨层
          <input id="recommend-reserve-uses" type="number" min="0" max="99" value="0">
          次
        </label>
        <label>
          当前源石锭
          <input id="current-ingots" type="number" min="0" max="999" value="0">
        </label>
        <label>
          零件箱上限
          <input id="part-box-capacity" type="number" min="1" max="99" value="12">
        </label>
        <label>
          阶段策略
          <select id="resource-policy-mode">
            <option value="auto">随层数自动</option>
            <option value="conserve">额外保留</option>
            <option value="spend">倾向消耗</option>
          </select>
        </label>
      </div>
      <div id="strategy-list" class="strategy-list"></div>
      <p class="muted" style="margin-top:8px">
        “至少保留”是硬约束；阶段策略是软价值，会在收益足够时允许前期用件，也不会强迫后期清空。误入奇境仍需额外消耗一件加工品。
      </p>
    </section>

    <section class="panel">
      <h2>节点完成后 · 奖励期望</h2>
      <div class="table-wrap">
        <table class="resource-table">
          <tbody id="resource-summary-body"></tbody>
        </table>
      </div>
      <p id="reward-evidence" class="muted" style="margin-top:8px"></p>
      <ul id="rewards-list" class="compact-list"></ul>
    </section>

    <section class="panel">
      <h2>各类节点完成结算</h2>
      <label class="field">节点类型
        <select id="reward-kind-select"></select>
      </label>
      <div id="reward-kind-detail" class="catalog-detail"></div>
    </section>

    <section class="panel">
      <h2>路线步骤</h2>
      <div class="route-table">
        <table>
          <thead><tr><th>#</th><th>节点</th><th>方式</th><th class="num">行动力</th></tr></thead>
          <tbody id="route-body"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <h2>零件箱与独立估值</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>零件</th><th class="num">次数</th><th class="num">当前估值</th><th></th></tr></thead>
          <tbody id="parts-body"></tbody>
        </table>
      </div>
      <div class="row" style="margin-top:8px">
        <label class="field grow">添加零件
          <select id="part-select"></select>
        </label>
        <button id="add-part" type="button">加入</button>
      </div>
      <p id="part-note" class="muted" style="margin-top:8px"></p>
    </section>

    <section class="panel">
      <h2>节点人工修正</h2>
      <div class="row">
        <button id="edit-mode" type="button" aria-pressed="false">开启修正模式</button>
        <label class="field grow">选中节点类型
          <select id="node-kind-select" disabled></select>
        </label>
      </div>
      <p id="node-detail" class="muted" style="margin-top:8px">用于标记识别不到的羽瞰点回访或居民占领节点。</p>
    </section>
  </aside>
</main>
<script>
const BOOTSTRAP=__BLACKFLOW_DATA__;
const graph=BOOTSTRAP.graph;
const nodes=Object.fromEntries(graph.nodes.map(node=>[node.node_id,node]));
const adjacency=Object.fromEntries(Object.keys(nodes).map(id=>[id,new Set()]));
for(const edge of graph.edges){
  adjacency[edge.first].add(edge.second);
  adjacency[edge.second].add(edge.first);
}
const movementRules=Object.fromEntries(
  BOOTSTRAP.movement_modes.map(mode=>[mode.id,mode])
);
const partCatalog=Object.fromEntries(
  BOOTSTRAP.parts.map(part=>[part.id,part])
);
const rewardKnowledge=BOOTSTRAP.reward_knowledge||{
  dimensions:[],kind_aliases:{},node_rewards:[]
};
const empiricalRewardKnowledge=BOOTSTRAP.empirical_rewards||{profiles:[]};
const EMPIRICAL_PROFILES=empiricalRewardKnowledge.profiles||[];
const REWARD_DIMENSIONS=rewardKnowledge.dimensions||[];
const REWARD_RULES=Object.fromEntries(
  (rewardKnowledge.node_rewards||[]).map(rule=>[rule.id,rule])
);
const REWARD_ALIASES=rewardKnowledge.kind_aliases||{};
const FORCED_ENCOUNTERS=rewardKnowledge.forced_encounters||[];
const PROCESSED_PART_IDS=new Set(
  BOOTSTRAP.parts
    .filter(part=>part.category==="processed")
    .map(part=>part.id)
);
const EXIT_KINDS=new Set(["enemy","exit_end","exit_path"]);
const MERCHANT_KINDS=new Set([
  "shop","special_shop","secret_trader","rogue_trader"
]);
const DEFAULT_FLOOR_RESOURCE_POLICIES={
  1:{label:"蓄力期",reserveRatio:.65,spendMultiplier:1.55,reservePenalty:8,hoardPenalty:0,ingotReserve:18,merchantWeight:.18,unspentIngotPenalty:0},
  2:{label:"保留期",reserveRatio:.5,spendMultiplier:1.35,reservePenalty:7,hoardPenalty:.05,ingotReserve:15,merchantWeight:.22,unspentIngotPenalty:.03},
  3:{label:"成长期",reserveRatio:.35,spendMultiplier:1.1,reservePenalty:6,hoardPenalty:.2,ingotReserve:12,merchantWeight:.3,unspentIngotPenalty:.08},
  4:{label:"转化期",reserveRatio:.2,spendMultiplier:.85,reservePenalty:5,hoardPenalty:.55,ingotReserve:8,merchantWeight:.42,unspentIngotPenalty:.16},
  5:{label:"兑现期",reserveRatio:.1,spendMultiplier:.55,reservePenalty:3.5,hoardPenalty:1.1,ingotReserve:4,merchantWeight:.58,unspentIngotPenalty:.3},
  6:{label:"终局期",reserveRatio:0,spendMultiplier:.3,reservePenalty:2,hoardPenalty:1.8,ingotReserve:0,merchantWeight:.72,unspentIngotPenalty:.55}
};
const configuredFloorPolicies=Object.fromEntries(
  (BOOTSTRAP.resource_lifecycle_policy?.floors||[]).map(item=>[
    Number(item.floor),{
      label:item.label,
      reserveRatio:Number(item.reserve_ratio),
      spendMultiplier:Number(item.spend_multiplier),
      reservePenalty:Number(item.reserve_penalty),
      hoardPenalty:Number(item.hoard_penalty),
      ingotReserve:Number(item.ingot_reserve),
      merchantWeight:Number(item.merchant_weight),
      unspentIngotPenalty:Number(item.unspent_ingot_penalty)
    }
  ])
);
const FLOOR_RESOURCE_POLICIES=Object.keys(configuredFloorPolicies).length
  ?configuredFloorPolicies
  :DEFAULT_FLOOR_RESOURCE_POLICIES;
const STRATEGIES=[
  {
    id:"combat",name:"战斗推进",tone:"主动获取作战经验与战后资源",
    weights:{
      combat:11,emergency_combat:16,enemy:20,resident_base:15,
      resident_occupied:9,unknown_combat:7,encounter:6,wish:5,
      overlook:3,portal:4,exit_end:12,exit_path:10
    },
    resourceWeights:{
      hope:2,originium_ingots:.5,command_xp:.7,
      collectibles:5,recruitment_tickets:4.5,parts:4,target_life:1
    },
    apWeight:.8,partCost:1.2,exitBonus:24,portalBonus:2,pursuitPenalty:20
  },
  {
    id:"conservative",name:"保守撤离",tone:"优先安全出口、行动力余量与低风险节点",
    weights:{
      combat:-3,emergency_combat:-10,enemy:7,resident_base:-9,
      resident_occupied:-7,unknown_combat:-8,unknown_event:-3,
      overlook:8,safe_house:9,wish:7,shop:5,special_shop:5,
      lost_and_found:5,forest:1,portal:-3,exit_end:18,exit_path:20
    },
    resourceWeights:{
      hope:4,originium_ingots:.3,command_xp:.15,
      collectibles:2,recruitment_tickets:2,parts:3,target_life:8
    },
    apWeight:3.2,partCost:3.2,exitBonus:38,portalBonus:-3,pursuitPenalty:55
  },
  {
    id:"balanced",name:"综合收益",tone:"兼顾可计算收益、风险、出口与零件成本",
    weights:{
      combat:7,emergency_combat:8,enemy:12,resident_base:10,
      resident_occupied:5,unknown_combat:2,unknown_event:3,event:4,
      encounter:9,wish:10,overlook:7,safe_house:6,scout:6,
      lost_and_found:5,portal:7,exit_end:16,exit_path:15
    },
    resourceWeights:{
      hope:4,originium_ingots:.8,command_xp:.35,
      collectibles:7,recruitment_tickets:5,parts:6,target_life:3
    },
    apWeight:1.7,partCost:2,exitBonus:30,portalBonus:5,pursuitPenalty:38
  },
  {
    id:"exploration",name:"探索揭示",tone:"偏好未知事件、羽瞰点、密道和黑潭入口",
    weights:{
      combat:2,emergency_combat:1,enemy:8,resident_base:5,
      unknown_combat:10,unknown_event:14,event:11,overlook:13,
      tunnel:10,portal:18,scout:9,wish:8,encounter:7,
      lost_and_found:6,exit_end:9,exit_path:10
    },
    resourceWeights:{
      hope:3,originium_ingots:.3,command_xp:.1,
      collectibles:5,recruitment_tickets:2,parts:3,target_life:1.5
    },
    apWeight:1.1,partCost:1.5,exitBonus:19,portalBonus:18,pursuitPenalty:30
  }
];
const startNode=graph.nodes.find(node=>node.kind==="current")?.node_id
  || graph.nodes[0]?.node_id;
const KIND_OPTIONS=[
  ["forest","林间空地"],["overlook","羽瞰点"],["combat","作战"],
  ["emergency_combat","紧急作战"],["resident_base","“居民”据点"],
  ["resident_occupied","流窜“居民”占领"],["event","不期而遇"],
  ["unknown_combat","未知的凶戾"],["unknown_event","未知的诡秘"],
  ["tunnel","曲折密道"],["shop","秘境行商"],
  ["special_shop","诡意行商"],["encounter","狭路相逢"],
  ["wish","得偿所愿"],["enemy","险路恶敌"],
  ["safe_house","安全的角落"],["fate","命运所指"],
  ["lost_and_found","失与得"],["exit_end","险路尽头"],
  ["exit_path","险路小径"],["emergency_support","应急助力"],
  ["portal","误入奇境"],["scout","先行一步"]
];
const KIND_LABEL=Object.fromEntries(KIND_OPTIONS);
const state={
  actions:[],
  parts:(BOOTSTRAP.sample_parts||[]).map((part,index)=>({
    instanceId:`part-${index+1}`,
    partId:part.part_id,
    uses:part.uses??null,
    value:part.estimated_value??0
  })),
  overrides:{},
  editMode:false,
  selectedNode:null,
  nextPartId:(BOOTSTRAP.sample_parts||[]).length+1,
  floor:Number(BOOTSTRAP.floor||3),
  recommendationCache:null
};
const svg=document.getElementById("map-overlay");
const ns="http://www.w3.org/2000/svg";
document.getElementById("map-image").src=BOOTSTRAP.image_data||"";
document.getElementById("initial-ap").value=String(BOOTSTRAP.initial_action_points??4);
document.getElementById("current-floor").value=String(state.floor);

function gridPosition(id){
  const match=/^node_r(-?\d+)c(-?\d+)$/.exec(id);
  return match?[Number(match[1]),Number(match[2])]:null;
}
function kindOf(id){ return state.overrides[id]||nodes[id].kind; }
function rewardKind(kind){ return REWARD_ALIASES[kind]||kind; }
function tunnelPairs(){
  const ids=Object.keys(nodes).filter(id=>kindOf(id)==="tunnel").sort();
  return ids.length===2?{[ids[0]]:ids[1],[ids[1]]:ids[0]}:{};
}
function movementSpec(selection){
  const [modeId,partId=""]=selection.split("|");
  return {modeId,partId,rule:movementRules[modeId]};
}
function currentNode(){

function nodeClass(kind){
  if(["combat","emergency_combat","enemy","resident_base","resident_occupied","unknown_combat"].includes(kind)) return "combat";
  if(["tunnel","overlook","shop","special_shop","secret_trader","rogue_trader","encounter","wish","exit_end","exit_path"].includes(kind)) return "special";
  if(["forest"].includes(kind)) return "forest";
  if(["current"].includes(kind)) return "current";
  return "event";
}
function isCombat(kind){

function isLegal(source,target,spec){
  if(!source||!nodes[target]) return [false,"节点不存在"];
  if(source===target) return [false,"本版不处理原地重复进入"];
  if(spec.modeId==="walk"){
    return adjacency[source].has(target)
      ?[true,""]:[false,"徒步请逐段点击相邻节点"];
  }
  if(spec.modeId==="tunnel_transfer") return [false,"曲折密道会在抵达时自动传送"];
  const a=gridPosition(source),b=gridPosition(target);
  if(!a||!b) return [false,"缺少稳定行列坐标"];
  const dr=Math.abs(a[0]-b[0]),dc=Math.abs(a[1]-b[1]);
  const targetRule=spec.rule.target_rule||{};
  const max=Number(targetRule.max||0);
  let legal=false;
  if(targetRule.type==="orthogonal_distance") legal=(dr===0||dc===0)&&dr+dc<=max;
  else if(targetRule.type==="chebyshev_radius") legal=Math.max(dr,dc)<=max;
  else if(targetRule.type==="manhattan_radius") legal=dr+dc<=max;
  else if(["any_node","random_any"].includes(targetRule.type)) legal=true;
  if(!legal) return [false,"目标不符合该零件的距离或方向限制"];
  const kind=kindOf(target);
  if(targetRule.node_filter==="non_combat"&&isCombat(kind)) return [false,"该零件不能选择作战节点"];
  if(targetRule.node_filter==="merchant"&&!["shop","special_shop","secret_trader","rogue_trader"].includes(kind)) return [false,"该零件只能选择行商节点"];
  return [true,""];
}
function initialPartState(){
  return Object.fromEntries(state.parts.map(part=>[
    part.instanceId,{...part,remaining:Number.isFinite(part.uses)?part.uses:null}

function addOpportunity(result,label){

function emptyResourceStats(){
  return Object.fromEntries(REWARD_DIMENSIONS.map(dimension=>[
    dimension.id,{
      minimum:0,maximum:0,expected:0,pending:0,notes:[],
      empiricalExpected:0,empiricalWeightedExpected:0
    }
  ]));
}
function addResourceNote(stat,note){
  if(note&&!stat.notes.includes(note)) stat.notes.push(note);
}
function applyRewardEntry(result,dimensionId,entry){
  const stat=result.resourceStats[dimensionId];
  if(!stat||!entry) return;
  const kind=entry.kind;
  if(kind==="exact"){
    const value=Number(entry.value||0);
    stat.minimum+=value; stat.maximum+=value; stat.expected+=value;
  } else if(kind==="conditional_exact"){
    stat.maximum+=Number(entry.value||0); stat.pending+=1;
  } else if(["choice","conditional"].includes(kind)){
    stat.minimum+=Number(entry.minimum||0);
    if(Number.isFinite(entry.maximum)) stat.maximum+=Number(entry.maximum);
    else stat.pending+=1;
  } else if(kind==="remaining_ap"){
    const value=Math.max(0,result.ap);
    stat.minimum+=value; stat.maximum+=value; stat.expected+=value;
  } else if(["possible","variable","indirect"].includes(kind)){
    stat.pending+=1;
  }
  const distribution=entry.known_distribution;
  if(distribution){
    stat.minimum+=Number(distribution.minimum||0);
    stat.maximum+=Number(distribution.maximum||0);
    stat.expected+=Number(distribution.expected||0);
    addResourceNote(stat,distribution.summary);
  }
  addResourceNote(stat,entry.summary);
}
function empiricalProfile(kind){
  const canonical=rewardKind(kind);
  const context=BOOTSTRAP.location_context||"main_map";
  const exact=EMPIRICAL_PROFILES.find(profile=>
    Number(profile.floor)===Number(state.floor)
    &&profile.location_context===context
    &&profile.node_kind===canonical
  )||null;
  const fallback=EMPIRICAL_PROFILES.find(profile=>
    profile.floor===null
    &&profile.cross_floor_fallback
    &&profile.location_context===context
    &&profile.node_kind===canonical
  )||null;
  if(!exact) return fallback;
  if(!fallback||Number(fallback.sample_count)<=Number(exact.sample_count)){
    return exact;
  }
  const common=Object.keys(exact.rewards||{}).filter(
    id=>fallback.rewards?.[id]
  );
  const agrees=common.every(id=>
    Number(exact.rewards[id].expected)===Number(fallback.rewards[id].expected)
  );
  return agrees?fallback:exact;
}
function applyKnownDistributionOnly(result,dimensionId,entry){
  const stat=result.resourceStats[dimensionId];
  const distribution=entry?.known_distribution;
  if(!stat||!distribution) return;
  stat.minimum+=Number(distribution.minimum||0);
  stat.maximum+=Number(distribution.maximum||0);
  stat.expected+=Number(distribution.expected||0);
  addResourceNote(stat,distribution.summary);
}
function applyEmpiricalProfile(result,profile,excludedDimensions=new Set()){
  if(!profile) return;
  for(const [dimensionId,reward] of Object.entries(profile.rewards||{})){
    if(excludedDimensions.has(dimensionId)) continue;
    const stat=result.resourceStats[dimensionId];
    if(!stat) continue;
    const expected=Number(reward.expected||0);
    stat.minimum+=Number(reward.minimum||0);
    stat.maximum+=Number(reward.maximum||0);
    stat.expected+=expected;
    stat.empiricalExpected+=expected;
    stat.empiricalWeightedExpected+=
      expected*Number(profile.confidence_weight||0);
    addResourceNote(
      stat,
      `实测 ${profile.sample_count} 场（${profile.confidence_zh}）`
    );
  }
  result.empiricalEvidence.push(profile);
}
function applyNodeRewards(result,kind){
  const rule=REWARD_RULES[rewardKind(kind)];
  const profile=empiricalProfile(kind);
  const authoritativeDimensions=new Set();
  if(rule){
    for(const [dimensionId,entry] of Object.entries(rule.rewards||{})){
      if([
        "exact","conditional_exact","choice","conditional","remaining_ap"
      ].includes(entry.kind)){
        authoritativeDimensions.add(dimensionId);
        applyRewardEntry(result,dimensionId,entry);
      } else if(profile?.rewards?.[dimensionId]){
        applyKnownDistributionOnly(result,dimensionId,entry);
      } else {
        applyRewardEntry(result,dimensionId,entry);
      }
    }
  }
  applyEmpiricalProfile(result,profile,authoritativeDimensions);
}
function settleForcedEncounter(result){
  if(result.forcedEncounters.length||result.ap!==0) return;
  const rule=FORCED_ENCOUNTERS.find(
    item=>item.id==="pursuit_on_ap_exhaustion"
  );
  if(!rule) return;
  const variantId=rule.default_variant||"normal";
  const variant=rule.variants?.[variantId]||{};
  const label=variant.name_zh||rule.name_zh||"追猎";
  result.forcedEncounters.push(label);
  addOpportunity(result,`强制遭遇：${label}`);
  result.combats+=1;
  for(const [dimensionId,entry] of Object.entries(variant.rewards||{})){
    applyRewardEntry(result,dimensionId,entry);
  }
  for(const effect of variant.additional_effects||[]){
    if(effect.summary&&!result.warnings.includes(effect.summary)){
      result.warnings.push(effect.summary);
    }
  }
}

function consumePartUse(result,part,{exhaust=false}={}){
  if(!part||!Number.isFinite(part.remaining)||part.remaining<=0) return false;
  part.remaining=exhaust?0:part.remaining-1;
  if(part.remaining===0){
    result.partMin-=Math.max(0,Number(part.value||0));
    result.partMax-=Math.max(0,Number(part.value||0));
  }
  return true;
}
function simulate(actions=state.actions){
  const result={
    valid:true,ap:Number(document.getElementById("initial-ap").value||0),
    hope:0,ingots:0,collectibles:0,combats:0,moves:0,
    current:startNode,steps:[],completed:new Set(),opportunities:{},
    resourceStats:emptyResourceStats(),
    parts:initialPartState(),partMin:0,partMax:0,error:"",warnings:[],
    forcedEncounters:[],empiricalEvidence:[]
  };
  for(const part of Object.values(result.parts)){
    result.partMin+=Math.max(0,Number(part.value||0));
    result.partMax+=Math.max(0,Number(part.value||0));
  }
  const oneShot=new Set([
    "combat","emergency_combat","enemy","unknown_combat","unknown_event",
    "event","safe_house","fate","wish","encounter","lost_and_found",
    "emergency_support","resident_base","resident_occupied","portal","scout",
    "exit_end","exit_path"
  ]);
  for(let index=0;index<actions.length;index++){
    const action=actions[index];
    const spec={modeId:action.modeId,partId:action.partId,rule:movementRules[action.modeId]};
    if(!spec.rule){
      result.valid=false; result.error=`第${index+1}步：未知移动方式`; break;
    }
    const [legal,reason]=isLegal(result.current,action.target,spec);
    if(!legal){ result.valid=false; result.error=`第${index+1}步：${reason}`; break; }
    const cost=Number(spec.rule.action_point_cost?.value||0);
    if(result.ap<cost){ result.valid=false; result.error=`第${index+1}步：行动力不足`; break; }
    let selectedPart=null;
    if(spec.rule.part_id){
      selectedPart=result.parts[action.partId];
      if(!selectedPart||selectedPart.partId!==spec.rule.part_id||selectedPart.remaining<=0){
        result.valid=false; result.error=`第${index+1}步：对应零件不可用`; break;
      }
    }
    result.ap-=cost;
    result.moves+=1;
    if(selectedPart){
      consumePartUse(result,selectedPart);
    }
    let postAp=0;
    for(const effect of spec.rule.post_effects||[]){
      if(effect.resource==="action_points"){ result.ap+=effect.delta; postAp+=effect.delta; }
      if(effect.resource==="hope"){
        result.hope+=effect.delta;
        applyRewardEntry(result,"hope",{kind:"exact",value:effect.delta,summary:"移动零件效果"});
      }
      if(effect.resource==="originium_ingots"){
        result.ingots+=effect.delta;
        applyRewardEntry(result,"originium_ingots",{kind:"exact",value:effect.delta,summary:"移动零件效果"});
      }
    }
    const kind=kindOf(action.target);
    const first=oneShot.has(kind)&&!result.completed.has(action.target);
    if(kind==="portal"&&first){
      const portalPart=result.parts[action.portalPartId];
      if(
        !portalPart
        ||!PROCESSED_PART_IDS.has(portalPart.partId)
        ||!consumePartUse(result,portalPart,{exhaust:true})
      ){
        result.valid=false;
        result.error=`第${index+1}步：进入误入奇境需要额外消耗1件可用加工品`;
        break;
      }
      result.warnings.push(
        `进入误入奇境额外消耗「${partCatalog[portalPart.partId]?.name_zh||portalPart.partId}」`
      );
    }
    if(first) result.completed.add(action.target);
    if(kind==="tunnel"){
      const pair=tunnelPairs()[action.target];
      result.completed.add(action.target);
      if(pair) result.completed.add(pair);
    }
    const nodeAp=settleNode(result,action.target,first);
    if(spec.rule.target_rule?.type==="random_any"){
      result.warnings.push("小八界目标随机，当前终点只是情景假设");
    }
    const paired=kind==="tunnel"?tunnelPairs()[action.target]:null;
    const destination=paired||action.target;
    if(kind==="tunnel"&&!paired) result.warnings.push("曲折密道未成功配对，无法自动传送");
    result.steps.push({
      index:index+1,source:result.current,selectedTarget:action.target,
      target:destination,modeId:action.modeId,partId:action.partId,
      portalPartId:kind==="portal"&&first?action.portalPartId:"",
      cost,gain:postAp+nodeAp,apAfter:result.ap,kind,
      firstCompletion:first,autoTeleport:Boolean(paired)
    });
    result.current=destination;
    if(result.ap===0&&!["exit_end","exit_path","enemy","portal"].includes(kind)){
      settleForcedEncounter(result);
    }
  }
  for(const part of Object.values(result.parts)){
    if(part.remaining===0) continue;
    const base=Math.max(0,Number(part.value||0));
    if(part.partId==="blood_mushroom"){
      result.partMin+=result.combats*2; result.partMax+=result.combats*2;
    } else if(part.partId==="homesick_fruit"){
      const loss=Math.min(base,result.moves*2);
      result.partMin-=loss; result.partMax-=loss;
    } else if(part.partId==="wave"){
      result.partMin-=Math.min(base,result.moves*8);
      result.partMax+=result.moves*11;
    }
  }
  return result;
}

function isCarryablePart(part){

function remainingCarryableUses(result){

function currentResourcePolicy(){
  const base={...(FLOOR_RESOURCE_POLICIES[state.floor]||FLOOR_RESOURCE_POLICIES[3])};
  const mode=document.getElementById("resource-policy-mode").value||"auto";
  if(mode==="conserve"){
    base.label+=" · 额外保留";
    base.reserveRatio=Math.min(1,base.reserveRatio+.2);
    base.spendMultiplier*=1.3;
    base.reservePenalty*=1.25;
    base.hoardPenalty*=.45;
    base.ingotReserve+=6;
    base.merchantWeight*=.7;
    base.unspentIngotPenalty*=.4;
  } else if(mode==="spend"){
    base.label+=" · 倾向消耗";
    base.reserveRatio=Math.max(0,base.reserveRatio-.2);
    base.spendMultiplier*=.65;
    base.reservePenalty*=.6;
    base.hoardPenalty=base.hoardPenalty*1.45+.25;
    base.ingotReserve=Math.max(0,base.ingotReserve-6);
    base.merchantWeight*=1.35;
    base.unspentIngotPenalty=base.unspentIngotPenalty*1.4+.05;
  }
  return base;
}
function partFlexibilityPremium(part){
  const catalog=partCatalog[part.partId];
  const rule=movementRules[catalog?.movement_mode];
  if(!rule) return 0;
  const target=rule.target_rule||{};
  let premium=0;
  if(target.type==="any_node") premium+=2.4;
  else if(target.type==="manhattan_radius") premium+=Number(target.max||0)*.65;
  else if(target.type==="orthogonal_distance") premium+=Number(target.max||0)*.45;
  else if(target.type==="chebyshev_radius") premium+=Number(target.max||0)*.4;
  if(Number(rule.action_point_cost?.value||0)===0) premium+=1.4;
  if((rule.post_effects||[]).length) premium+=1;
  return premium;
}
function portalFuelIds(result){
  return Object.values(result.parts)
    .filter(part=>
      PROCESSED_PART_IDS.has(part.partId)
      &&Number(part.remaining||0)>0
    )
    .sort((a,b)=>{
      const aCost=Number(a.value||0);
      const bCost=Number(b.value||0);
      return aCost-bCost
        ||Number(a.remaining||0)-Number(b.remaining||0)
        ||a.instanceId.localeCompare(b.instanceId);
    })
    .map(part=>part.instanceId);

function routePartSpend(result){
  let uses=0;
  let valueCost=0;
  let carryableUses=0;
  let expiringUses=0;
  for(const part of state.parts){
    if(!PROCESSED_PART_IDS.has(part.partId)) continue;
    const live=result.parts[part.instanceId];
    const initial=Math.max(0,Number(part.uses||0));
    const remaining=Math.max(0,Number(live?.remaining||0));
    const spent=Math.max(0,initial-remaining);
    uses+=spent;
    const carryable=isCarryablePart(part);
    if(carryable) carryableUses+=spent;
    else expiringUses+=spent;
    valueCost+=spent*(
      .6
      +Number(part.value||0)/Math.max(1,initial)
      +(carryable?partFlexibilityPremium(part):0)
    );
  }
  return {uses,valueCost,carryableUses,expiringUses};
}
function routeLifecycle(result){
  const policy=currentResourcePolicy();
  const initial=initialPartState();
  const initialCarryable=Object.values(initial)
    .filter(part=>isCarryablePart(part))
    .reduce((total,part)=>total+Math.max(0,Number(part.remaining||0)),0);
  const hardReserve=Math.max(
    0,Number(document.getElementById("recommend-reserve-uses").value||0)
  );
  const desiredReserve=Math.max(
    hardReserve,Math.ceil(initialCarryable*policy.reserveRatio)
  );
  const remainingCarryable=remainingCarryableUses(result);
  const remainingExpiring=remainingExpiringUses(result);
  const reserveShortfall=Math.max(0,desiredReserve-remainingCarryable);
  const carryableSurplus=Math.max(0,remainingCarryable-desiredReserve);
  const merchantVisited=result.steps.some(step=>MERCHANT_KINDS.has(step.kind));
  const currentIngots=Math.max(
    0,Number(document.getElementById("current-ingots").value||0)
  );
  const projectedIngots=currentIngots+
    Number(result.resourceStats.originium_ingots?.expected||0);
  const spendableIngots=Math.max(0,currentIngots-policy.ingotReserve);
  const projectedSurplusIngots=Math.max(0,projectedIngots-policy.ingotReserve);
  const capacity=Math.max(
    1,Number(document.getElementById("part-box-capacity").value||12)
  );
  const livePartCount=Object.values(result.parts).filter(
    part=>part.remaining===null||Number(part.remaining||0)>0
  ).length;
  const projectedBoxUse=livePartCount+
    Number(result.resourceStats.parts?.expected||0);
  const boxPressure=Math.max(0,projectedBoxUse-capacity);
  const boxUrgency=Math.max(0,projectedBoxUse-capacity*.8);
  return {
    policy,desiredReserve,remainingCarryable,remainingExpiring,
    reserveShortfall,carryableSurplus,merchantVisited,currentIngots,
    projectedIngots,spendableIngots,projectedSurplusIngots,
    capacity,projectedBoxUse,boxPressure,boxUrgency
  };
}
function routeTerminalKind(result){

function isRouteTerminal(result){

function routeScore(result,strategy){
  let score=0;
  for(const step of result.steps){
    if(step.firstCompletion||["overlook","tunnel"].includes(step.kind)){
      score+=Number(strategy.weights[step.kind]||0);
    }
  }
  for(const [id,weight] of Object.entries(strategy.resourceWeights||{})){
    const stat=result.resourceStats[id];
    if(stat){
      const effective=
        Number(stat.expected||0)
        -Number(stat.empiricalExpected||0)
        +Number(stat.empiricalWeightedExpected||0);
      score+=effective*weight;
    }
  }
  score+=Math.max(0,result.ap)*strategy.apWeight;
  const spend=routePartSpend(result);
  const lifecycle=routeLifecycle(result);
  score-=
    spend.valueCost
    *strategy.partCost
    *lifecycle.policy.spendMultiplier;
  score-=lifecycle.reserveShortfall*lifecycle.policy.reservePenalty;
  score-=result.steps.length*.25;
  const terminal=routeTerminalKind(result);
  if(EXIT_KINDS.has(terminal)){
    score+=strategy.exitBonus;
    score-=lifecycle.carryableSurplus*lifecycle.policy.hoardPenalty;
    score-=lifecycle.remainingExpiring*9;
    if(!lifecycle.merchantVisited){
      score-=
        lifecycle.projectedSurplusIngots
        *lifecycle.policy.unspentIngotPenalty;
      score-=lifecycle.boxPressure*10;
    }
  }
  else if(terminal==="portal") score+=strategy.portalBonus;
  else score-=8;
  if(lifecycle.merchantVisited){
    score+=
      lifecycle.spendableIngots
      *lifecycle.policy.merchantWeight;
    score+=lifecycle.boxUrgency*2.5;
  }
  if(result.forcedEncounters.length){
    score-=strategy.pursuitPenalty;
  }
  return score;
}
function routeStateSignature(result){
  const completed=[...result.completed].sort().join(",");
  const parts=Object.values(result.parts)
    .sort((a,b)=>a.instanceId.localeCompare(b.instanceId))
    .map(part=>`${part.instanceId}:${part.remaining}`)
    .join(",");
  return `${result.current}|${result.ap}|${completed}|${parts}|${result.forcedEncounters.length}`;
}
function routeActionSignature(actions){
  return actions.map(action=>
    `${action.target}:${action.modeId}:${action.partId||""}:${action.portalPartId||""}`
  ).join(">");
}
function candidateMovements(result,useParts){
  const choices=[{modeId:"walk",partId:"",rule:movementRules.walk}];
  if(!useParts) return choices;
  for(const part of state.parts){
    const catalog=partCatalog[part.partId];
    const live=result.parts[part.instanceId];
    if(
      catalog?.category!=="processed"
      ||!live
      ||Number(live.remaining||0)<=0
    ) continue;
    const rule=movementRules[catalog.movement_mode];
    if(!rule||rule.target_rule?.type==="random_any") continue;
    choices.push({
      modeId:rule.id,partId:part.instanceId,rule
    });
  }
  return choices;
}
function expandRoute(prefix,result,{useParts,reserveUses}){
  const expansions=[];
  const completed=result.completed;
  for(const spec of candidateMovements(result,useParts)){
    const targets=spec.modeId==="walk"
      ?[...(adjacency[result.current]||[])]
      :Object.keys(nodes);
    for(const target of targets){
      if(target===result.current) continue;
      const kind=kindOf(target);
      if(
        completed.has(target)
        &&!["forest","overlook","tunnel","current"].includes(kind)
      ) continue;
      const [legal]=isLegal(result.current,target,spec);
      if(!legal) continue;
      const baseAction={
        target,modeId:spec.modeId,partId:spec.partId,portalPartId:""
      };
      const fuelOptions=kind==="portal"
        ?(useParts?portalFuelIds(result):[])
        :[""];
      for(const portalPartId of fuelOptions){
        const action={...baseAction,portalPartId};
        const actions=[...prefix,action];
        const next=simulate(actions);
        if(!next.valid) continue;
        if(remainingCarryableUses(next)<reserveUses) continue;
        expansions.push({actions,result:next});
        break;
      }
    }
  }
  return expansions;
}
function findStrategyCandidates(strategy,options){
  const initial=simulate([]);
  if(!initial.valid) return [];
  let frontier=[{actions:[],result:initial}];
  const candidates=[];
  const seen=new Map();
  const maxDepth=Math.min(9,Math.max(4,initial.ap+4));
  for(let depth=0;depth<maxDepth;depth++){
    const nextFrontier=[];
    for(const item of frontier){
      for(const expanded of expandRoute(item.actions,item.result,options)){
        const score=routeScore(expanded.result,strategy);
        const signature=routeStateSignature(expanded.result);
        const previous=seen.get(signature);
        if(previous!==undefined&&previous>=score) continue;
        seen.set(signature,score);
        candidates.push({...expanded,score});
        if(
          !isRouteTerminal(expanded.result)
          &&expanded.result.ap>0
        ){
          nextFrontier.push({...expanded,score});
        }
      }
    }
    nextFrontier.sort((a,b)=>b.score-a.score);
    frontier=nextFrontier.slice(0,70);
    if(!frontier.length) break;
  }
  return candidates.sort((a,b)=>b.score-a.score);
}
function recommendationKey(){
  return JSON.stringify({
    floor:state.floor,
    ap:Number(document.getElementById("initial-ap").value||0),
    ingots:Number(document.getElementById("current-ingots").value||0),
    capacity:Number(document.getElementById("part-box-capacity").value||12),
    resourcePolicy:document.getElementById("resource-policy-mode").value,
    useParts:document.getElementById("recommend-use-parts").checked,
    reserve:Number(document.getElementById("recommend-reserve-uses").value||0),
    parts:state.parts.map(part=>[
      part.instanceId,part.partId,part.uses,part.value
    ]),
    overrides:state.overrides
  });
}
function buildRecommendations(){
  const key=recommendationKey();
  if(state.recommendationCache?.key===key){
    return state.recommendationCache.routes;
  }
  const useParts=document.getElementById("recommend-use-parts").checked;
  const initial=simulate([]);
  const requestedReserve=Math.max(
    0,
    Number(document.getElementById("recommend-reserve-uses").value||0)
  );
  const reserveUses=Math.min(
    requestedReserve,
    remainingCarryableUses(initial)
  );
  const options={useParts,reserveUses};
  const used=new Set();
  const routes=STRATEGIES.map(strategy=>{
    const candidates=findStrategyCandidates(strategy,options);
    const selected=candidates.find(candidate=>
      !used.has(routeActionSignature(candidate.actions))
    )||candidates[0]||null;
    if(selected) used.add(routeActionSignature(selected.actions));
    return {strategy,candidate:selected};
  });
  state.recommendationCache={key,routes};
  return routes;
}
function routeSummary(candidate){
  const result=candidate.result;
  const battles=result.steps.filter(step=>
    ["combat","emergency_combat","enemy","resident_base","resident_occupied"].includes(step.kind)
    &&step.firstCompletion
  ).length;
  const unknowns=result.steps.filter(step=>
    ["unknown_combat","unknown_event"].includes(step.kind)
    &&step.firstCompletion
  ).length;
  const spend=routePartSpend(result);
  const terminal=routeTerminalKind(result);
  const tags=[
    `余${result.ap}行动力`,
    battles?`${battles}场已知作战`:"",
    unknowns?`${unknowns}个未知节点`:"",
    spend.uses?`用${spend.uses}次加工品`:"全程徒步",
    EXIT_KINDS.has(terminal)?`抵达${KIND_LABEL[terminal]}`:"",
    terminal==="portal"?"进入黑潭":"",
    result.forcedEncounters.length?"触发追猎":""
  ].filter(Boolean);
  return tags.join(" · ");
}
function compactNumber(value){
  return Number(value||0).toFixed(2).replace(/\.?0+$/,"");
}
function empiricalRewardSummary(result){
  const labels={
    command_xp:"经验",originium_ingots:"锭",recruitment_tickets:"券",
    collectibles:"藏品",parts:"零件",target_life:"生命"
  };
  const ordered=[
    "command_xp","originium_ingots","recruitment_tickets",
    "collectibles","parts","target_life"
  ];
  const values=ordered.map(id=>{
    const value=Number(result.resourceStats[id]?.empiricalExpected||0);
    return value?`${labels[id]} ${compactNumber(value)}`:"";
  }).filter(Boolean);
  return values.length?`实测基础期望：${values.join(" · ")}`:"暂无匹配的实测基础奖励";
}
function empiricalEvidenceSummary(result){
  const counts=new Map();
  for(const profile of result.empiricalEvidence){
    counts.set(profile.id,(counts.get(profile.id)||0)+1);
  }
  const parts=[];
  for(const [id,count] of counts){
    const profile=EMPIRICAL_PROFILES.find(item=>item.id===id);
    if(!profile) continue;
    const floor=profile.floor===null?"跨层":`第${profile.floor}层`;
    const kind=KIND_LABEL[profile.node_kind]||profile.node_kind;
    parts.push(
      `${floor}${kind} n=${profile.sample_count}（${profile.confidence_zh}）${count>1?`×${count}节点`:""}`
    );
  }
  return parts.join("；");
}
function resourceLifecycleSummary(result){
  const lifecycle=routeLifecycle(result);
  const spend=routePartSpend(result);
  const details=[
    `${lifecycle.policy.label}：用${spend.uses}次，保留${lifecycle.remainingCarryable}次可跨层能力`,
    `软目标${lifecycle.desiredReserve}次`
  ];
  if(lifecycle.remainingExpiring&&EXIT_KINDS.has(routeTerminalKind(result))){
    details.push(`${lifecycle.remainingExpiring}次区域限定能力会浪费`);
  }
  if(lifecycle.merchantVisited){
    if(lifecycle.spendableIngots){
      details.push(`行商前约有${compactNumber(lifecycle.spendableIngots)}锭可周转`);
    } else {
      details.push("行商用于补给或处理箱位");
    }
  } else if(
    EXIT_KINDS.has(routeTerminalKind(result))
    &&lifecycle.projectedSurplusIngots>0
    &&lifecycle.policy.unspentIngotPenalty>0
  ){
    details.push(`预计${compactNumber(lifecycle.projectedSurplusIngots)}锭高于本层保留线`);
  }
  if(lifecycle.boxPressure>0){
    details.push(`预计超箱位${compactNumber(lifecycle.boxPressure)}`);
  }
  return details.join(" · ");
}

function addSvg(tag,attrs,parent=svg){

      });

      cx:node.center[0],cy:node.center[1],r:radius,

function handleNodeClick(id){
  if(state.editMode){
    state.selectedNode=id;
    render();
    return;
  }
  const selection=movementSpec(document.getElementById("movement-select").value);
  const [legal,reason]=isLegal(currentNode(),id,selection);
  if(!legal){ setMessage(reason,true); return; }
  const action={
    target:id,modeId:selection.modeId,partId:selection.partId,
    portalPartId:""
  };
  if(kindOf(id)==="portal"){
    const base=simulate();
    const fuel=portalFuelIds(base).find(partId=>
      simulate([...state.actions,{...action,portalPartId:partId}]).valid
    );
    if(!fuel){
      setMessage("误入奇境需要额外消耗1件加工品；当前没有可用入场零件",true);
      return;
    }
    action.portalPartId=fuel;
  }
  state.actions.push(action);
  const result=simulate();
  if(!result.valid){
    state.actions.pop();
    setMessage(result.error,true);
  } else {
    const portalText=action.portalPartId
      ?`；入场将额外消耗「${partCatalog[result.parts[action.portalPartId]?.partId]?.name_zh||"加工品"}」`
      :"";
    setMessage(`已加入路线${portalText}`,false);
  }
  render();
}

function rewardEntryText(entry){
  if(!entry) return "—";
  if(entry.kind==="exact") return `+${entry.value}`;
  if(entry.kind==="conditional_exact") return `满足条件 +${entry.value}`;
  if(["choice","conditional"].includes(entry.kind)){
    const minimum=Number(entry.minimum||0);
    return Number.isFinite(entry.maximum)
      ?`${minimum}–${entry.maximum}`:"条件收益";
  }
  if(entry.kind==="remaining_ap") return "剩余行动力×1";
  const knownExpected=entry.known_distribution
    ?`${entry.known_distribution.category==="in_stage_pickup"?"关卡内额外期望":"已知期望"} +${Number(entry.known_distribution.expected||0).toFixed(2).replace(/\.?0+$/,"")}`
    :"";
  if(entry.kind==="possible") return knownExpected||"可能";
  if(entry.kind==="variable") return knownExpected||"待补";
  if(entry.kind==="indirect") return "间接";
  if(entry.kind==="transaction") return "交易";
  if(entry.kind==="exchange") return "置换";
  if(entry.kind==="access") return "取回库存";
  if(entry.kind==="cost") return "消耗";
  return entry.summary||entry.kind;
}

  body.querySelectorAll("[data-remove]").forEach(button=>button.addEventListener("click",event=>{
    state.parts=state.parts.filter(item=>item.instanceId!==event.target.dataset.remove);
    state.actions=state.actions.filter(action=>action.partId!==event.target.dataset.remove);
    render();
  }));
  document.getElementById("part-note").textContent=
    "已加入几件实验零件，可修改或移除。估值不与节点随机奖励混算；不可跨层加工品在离层时仍有次数会受到浪费惩罚。";
}
function renderNodeEditor(){
  const select=document.getElementById("node-kind-select");
  select.disabled=!state.editMode||!state.selectedNode;
  if(state.selectedNode){
    select.value=kindOf(state.selectedNode);
    const node=nodes[state.selectedNode];
    document.getElementById("node-detail").textContent=
      `${state.selectedNode} · 识别为「${node.label}」${state.overrides[state.selectedNode]?" · 已人工修正":""}`;
  } else if(state.editMode){
    document.getElementById("node-detail").textContent="请在地图上选择需要修正的节点。";
  } else {
    document.getElementById("node-detail").textContent="用于标记识别不到的羽瞰点回访或居民占领节点。";
  }
}
function setMessage(text,isError){
  const element=document.getElementById("message");
  element.textContent=text;
  element.className=`message ${isError?"error":"ok"}`;
}
function render(){
  const result=simulate();
  refreshMovementOptions(result);
  renderMap(result);
  renderSummary(result);
  renderRecommendations();
  renderRoute(result);
  renderParts(result);
  renderNodeEditor();
  document.getElementById("map-hint").textContent=state.editMode
    ?"修正模式：点击节点，再选择实际类型。"
    :`当前位置：${currentNode()} · 点击下一节点加入路线。`;
  if(!result.valid) setMessage(result.error,true);
}
for(const [kind,label] of KIND_OPTIONS){
  const option=document.createElement("option"); option.value=kind; option.textContent=label;
  document.getElementById("node-kind-select").append(option);
}
for(const part of BOOTSTRAP.parts){
  const option=document.createElement("option"); option.value=part.id;
  option.textContent=`${part.name_zh} · ${part.category}`;
  document.getElementById("part-select").append(option);
}
for(const rule of rewardKnowledge.node_rewards||[]){
  const option=document.createElement("option");
  option.value=rule.id; option.textContent=rule.name_zh;
  document.getElementById("reward-kind-select").append(option);
}
document.getElementById("reward-kind-select").addEventListener("change",renderRewardCatalog);
document.getElementById("initial-ap").addEventListener("change",render);
document.getElementById("current-floor").addEventListener("change",event=>{
  state.floor=Number(event.target.value||3);
  state.recommendationCache=null;
  render();
  renderRewardCatalog();
});
document.getElementById("recommend-use-parts").addEventListener("change",render);
document.getElementById("recommend-reserve-uses").addEventListener("change",render);
document.getElementById("current-ingots").addEventListener("change",render);
document.getElementById("part-box-capacity").addEventListener("change",render);
document.getElementById("resource-policy-mode").addEventListener("change",render);
document.getElementById("undo-button").addEventListener("click",()=>{
  state.actions.pop(); setMessage("已撤销最后一步",false); render();
});
document.getElementById("reset-button").addEventListener("click",()=>{
  state.actions=[]; setMessage("路线已清空",false); render();
});
document.getElementById("add-part").addEventListener("click",()=>{
  const partId=document.getElementById("part-select").value;
  const catalog=partCatalog[partId];
  const mode=catalog.movement_mode?movementRules[catalog.movement_mode]:null;
  state.parts.push({
    instanceId:`part-${state.nextPartId++}`,
    partId,
    uses:mode?mode.uses:null,
    value:0
  });
  render();
});
document.getElementById("edit-mode").addEventListener("click",event=>{
  state.editMode=!state.editMode;
  state.selectedNode=null;
  event.target.setAttribute("aria-pressed",String(state.editMode));
  event.target.textContent=state.editMode?"退出修正模式":"开启修正模式";
  render();
});
document.getElementById("node-kind-select").addEventListener("change",event=>{
  if(!state.selectedNode) return;
  state.overrides[state.selectedNode]=event.target.value;
  state.actions=[];
  setMessage("节点类型已修正，路线已清空以重新结算",false);
  render();
});
render();
renderRewardCatalog();
</script>
</body>
</html>
